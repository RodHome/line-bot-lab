<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🛡️ 價值雷達戰情室 V2.1</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #0f172a; color: #f8fafc; }
        .card { transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); border: 1px solid #1e293b; }
        .card:hover { transform: translateY(-4px); box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.4); border-color: #3b82f6; }
        /* 💡 版本標籤樣式 */
        .ver-tag { position: fixed; bottom: 10px; right: 10px; font-size: 10px; color: #475569; pointer-events: none; }
    </style>
</head>
<body class="p-4 md:p-10 max-w-7xl mx-auto min-h-screen">

    <div class="ver-tag">Ver 2.1 (Performance Tracking)</div>

    <header class="mb-10 text-center md:text-left border-b border-slate-800 pb-6">
        <div class="flex flex-col md:flex-row md:items-end justify-between gap-4">
            <div>
                <div class="flex items-center justify-center md:justify-start gap-2 mb-2">
                    <span class="bg-blue-500 text-white text-[10px] font-black px-2 py-0.5 rounded">NEW LOGIC</span>
                    <h1 class="text-4xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-emerald-400">價值雷達戰情室</h1>
                </div>
                <p class="text-slate-400 font-medium italic">台股左側潛伏標的 · 歷史績效自動追蹤</p>
            </div>
            <div id="updateTime" class="text-slate-500 text-sm font-mono bg-slate-900 px-4 py-2 rounded-full border border-slate-800">資料加載中...</div>
        </div>
    </header>

    <div class="flex flex-col md:flex-row gap-6 mb-10 items-center justify-between">
        <div class="flex bg-slate-900 p-1.5 rounded-xl border border-slate-800 w-full md:w-auto" id="filter-buttons">
            <button onclick="renderData('NEW')" id="btn-NEW" class="flex-1 md:flex-none px-6 py-2.5 rounded-lg font-bold transition-all">🆕 今日最新 (3日內)</button>
            <button onclick="renderData('HISTORY')" id="btn-HISTORY" class="flex-1 md:flex-none px-6 py-2.5 rounded-lg font-bold transition-all">📊 歷史追蹤 (4-15日)</button>
        </div>
        <div id="stats-banner" class="text-slate-500 text-sm font-medium"></div>
    </div>

    <div id="stock-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6 text-slate-500 text-center">
        正在穿透數據霧霾...
    </div>

    <script>
        let globalData = [];
        let baseDate = new Date();

        async function loadData() {
            try {
                // 🛡️ 強制獲取最新數據 (加入隨機參數 bypass 快取)
                const response = await fetch('left_side_value.json?nocache=' + Date.now());
                globalData = await response.json();
                
                if (globalData.length > 0) {
                    baseDate = new Date(globalData[0].date);
                    document.getElementById('updateTime').innerText = `📡 最新掃描日期: ${globalData[0].date}`;
                }
                renderData('NEW');
            } catch (e) {
                document.getElementById('stock-grid').innerHTML = `<div class="col-span-full py-20 text-red-400">數據讀取失敗：請檢查 JSON 檔案連結</div>`;
            }
        }

        function renderData(mode) {
            // 切換按鈕狀態
            const isNew = mode === 'NEW';
            document.getElementById('btn-NEW').className = isNew ? "flex-1 md:flex-none px-6 py-2.5 rounded-lg font-bold bg-blue-600 text-white shadow-lg shadow-blue-900/20" : "flex-1 md:flex-none px-6 py-2.5 rounded-lg font-bold text-slate-500 hover:text-slate-300";
            document.getElementById('btn-HISTORY').className = !isNew ? "flex-1 md:flex-none px-6 py-2.5 rounded-lg font-bold bg-blue-600 text-white shadow-lg shadow-blue-900/20" : "flex-1 md:flex-none px-6 py-2.5 rounded-lg font-bold text-slate-500 hover:text-slate-300";

            let html = '';
            let showCount = 0;
            let hiddenCount = 0;

            globalData.forEach(s => {
                const entryDate = new Date(s.first_entry_date);
                const diffDays = Math.ceil(Math.abs(baseDate - entryDate) / (1000 * 60 * 60 * 24));

                // 核心規則：超過 15 天的老舊資料直接在前端濾除，不污染版面
                if (diffDays > 15) {
                    hiddenCount++;
                    return;
                }

                if (mode === 'NEW' && diffDays > 3) return;
                if (mode === 'HISTORY' && diffDays <= 3) return;

                showCount++;
                
                // 績效計算
                const roi = ((parseFloat(s.price) - parseFloat(s.first_entry_price)) / parseFloat(s.first_entry_price) * 100).toFixed(1);
                const roiColor = roi == 0 ? "text-slate-500" : (roi > 0 ? "text-red-400" : "text-emerald-400");

                const isL1 = s.trend_status.includes('L1');
                const statusColor = isL1 ? 'bg-red-500/10 text-red-400 border-red-500/20' : 'bg-amber-500/10 text-amber-400 border-amber-500/20';

                html += `
                <div class="card bg-slate-900/40 rounded-2xl p-6 flex flex-col h-full">
                    <div class="flex justify-between items-start mb-5">
                        <div>
                            <h2 class="text-2xl font-bold text-slate-100">${s.name}</h2>
                            <p class="text-slate-600 font-mono text-sm tracking-widest">${s.code}</p>
                        </div>
                        <div class="text-right">
                            <span class="text-[10px] text-slate-600 block uppercase font-black">Current Price</span>
                            <span class="text-2xl font-black text-slate-200">$${s.price}</span>
                        </div>
                    </div>

                    <div class="flex items-center gap-2 mb-6">
                        <span class="px-2 py-0.5 rounded text-[11px] font-black bg-indigo-500/10 text-indigo-400 border border-indigo-500/20">${s.score} PTS</span>
                        <span class="px-2 py-0.5 rounded text-[11px] font-black border ${statusColor}">${isL1 ? 'L1 起漲' : 'L0 築底'}</span>
                    </div>

                    <div class="bg-slate-950/60 rounded-xl p-4 border border-slate-800/50 mb-6">
                        <div class="flex justify-between items-center mb-3 text-[10px] text-slate-500 font-bold uppercase tracking-tighter">
                            <span>Entry: ${s.first_entry_date}</span>
                            <span class="bg-slate-800 text-slate-400 px-2 rounded-full">${diffDays}D AGO</span>
                        </div>
                        <div class="flex justify-between items-end">
                            <div>
                                <span class="text-[10px] text-slate-600 block">初始價</span>
                                <span class="text-slate-400 font-bold">$${s.first_entry_price}</span>
                            </div>
                            <div class="text-right">
                                <span class="text-[10px] text-slate-600 block">累積績效</span>
                                <span class="text-2xl font-black ${roiColor}">${roi > 0 ? '+' : ''}${roi}%</span>
                            </div>
                        </div>
                    </div>

                    <div class="grid grid-cols-2 gap-3 mt-auto">
                        <div class="bg-slate-900/80 p-2 rounded-lg border border-slate-800/30">
                            <span class="text-[10px] text-slate-600 block mb-0.5 text-center">季乖離</span>
                            <span class="text-sm font-black block text-center ${parseFloat(s.bias60) < -10 ? 'text-emerald-500' : 'text-slate-400'}">${s.bias60}</span>
                        </div>
                        <div class="bg-slate-900/80 p-2 rounded-lg border border-slate-800/30">
                            <span class="text-[10px] text-slate-600 block mb-0.5 text-center">量縮率</span>
                            <span class="text-sm font-black block text-center text-blue-500">${s.vol_ratio}</span>
                        </div>
                    </div>
                </div>`;
            });

            document.getElementById('stock-grid').innerHTML = showCount > 0 ? html : `<div class="col-span-full py-20 text-slate-700 italic border-2 border-dashed border-slate-800 rounded-3xl">此分類目前無追蹤數據</div>`;
            document.getElementById('stats-banner').innerHTML = `顯示 <strong>${showCount}</strong> 檔標的 | 已隱藏 ${hiddenCount} 檔過期標的`;
        }

        loadData();
    </script>
</body>
</html>
