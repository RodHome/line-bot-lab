<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🛡️ 價值雷達戰情室 V2.4</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #0f172a; color: #f8fafc; }
        .card { transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); border: 1px solid #1e293b; }
        .card:hover { transform: translateY(-4px); box-shadow: 0 20px 25px -5px rgba(59, 130, 246, 0.3); border-color: #3b82f6; }
        .ver-tag { position: fixed; bottom: 10px; right: 10px; font-size: 10px; color: #475569; pointer-events: none; }
        /* 自定義捲軸 */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 10px; }
    </style>
</head>
<body class="p-4 md:p-10 max-w-7xl mx-auto min-h-screen">

    <div class="ver-tag">Ver 2.4 (Developer Mode Enabled)</div>

    <header class="mb-10 text-center md:text-left border-b border-slate-800 pb-6">
        <div class="flex flex-col md:flex-row md:items-end justify-between gap-4">
            <div>
                <div class="flex items-center justify-center md:justify-start gap-2 mb-2">
                    <span id="mode-badge" class="bg-blue-600 text-white text-[10px] font-black px-2 py-0.5 rounded tracking-tighter">15D FOCUS</span>
                    <h1 class="text-4xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-emerald-400">價值雷達戰情室</h1>
                </div>
                <p class="text-slate-400 font-medium italic">台股左側潛伏標的 · 累積績效排序榜</p>
            </div>
            <div id="updateTime" class="text-slate-500 text-sm font-mono bg-slate-900 px-4 py-2 rounded-full border border-slate-800 tracking-tighter">Syncing...</div>
        </div>
    </header>

    <div class="flex flex-col md:flex-row gap-6 mb-10 items-center justify-between">
        <div class="flex bg-slate-900 p-1.5 rounded-xl border border-slate-800 w-full md:w-auto overflow-x-auto" id="filter-buttons">
            <button onclick="renderData('NEW')" id="btn-NEW" class="whitespace-nowrap px-6 py-2.5 rounded-lg font-bold transition-all">🆕 今日最新 (3日)</button>
            <button onclick="renderData('HISTORY')" id="btn-HISTORY" class="whitespace-nowrap px-6 py-2.5 rounded-lg font-bold transition-all">📊 歷史追蹤 (15日)</button>
            <button onclick="renderData('DEV_ALL')" id="btn-DEV_ALL" class="whitespace-nowrap px-6 py-2.5 rounded-lg font-bold transition-all border border-dashed border-slate-700">🚀 戰情全記錄 (開發者)</button>
        </div>
        <div id="stats-banner" class="text-slate-500 text-sm font-medium"></div>
    </div>

    <div id="stock-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
        <div class="col-span-full text-center py-20 text-slate-500 animate-pulse font-bold tracking-widest text-xl">正在調閱績效檔案...</div>
    </div>

    <script>
        let globalData = [];
        let baseDate = new Date();

        async function loadData() {
            try {
                const response = await fetch('left_side_value.json?t=' + Date.now());
                globalData = await response.json();
                
                if (globalData.length > 0) {
                    baseDate = new Date(globalData[0].date);
                    document.getElementById('updateTime').innerText = `📡 LAST SCAN: ${globalData[0].date}`;
                }
                // 預設給 User 看 15 天內的歷史追蹤 (你可以改成 NEW 如果你希望一進去最精簡)
                renderData('HISTORY'); 
            } catch (e) {
                document.getElementById('stock-grid').innerHTML = `<div class="col-span-full text-center text-red-400 p-10 bg-red-900/10 rounded-2xl border border-red-900/20">JSON LINK ERROR</div>`;
            }
        }

        function renderData(mode) {
            const buttons = ['NEW', 'HISTORY', 'DEV_ALL'];
            buttons.forEach(b => {
                const el = document.getElementById(`btn-${b}`);
                if (b === mode) {
                    el.className = "whitespace-nowrap px-6 py-2.5 rounded-lg font-bold bg-blue-600 text-white shadow-lg";
                } else {
                    el.className = "whitespace-nowrap px-6 py-2.5 rounded-lg font-bold text-slate-500 hover:text-slate-300";
                }
            });

            // 更新左上角標籤
            const badge = document.getElementById('mode-badge');
            if (mode === 'DEV_ALL') {
                badge.innerText = "FULL 30D RECORD";
                badge.className = "bg-purple-600 text-white text-[10px] font-black px-2 py-0.5 rounded tracking-tighter";
            } else {
                badge.innerText = "15D USER FOCUS";
                badge.className = "bg-blue-600 text-white text-[10px] font-black px-2 py-0.5 rounded tracking-tighter";
            }

            let filtered = [];
            globalData.forEach(s => {
                const entryDate = new Date(s.first_entry_date);
                const diffDays = Math.ceil(Math.abs(baseDate - entryDate) / (1000 * 60 * 60 * 24));
                
                const roiVal = ((parseFloat(s.price) - parseFloat(s.first_entry_price)) / parseFloat(s.first_entry_price) * 100);
                s.roiNum = roiVal;
                s.daysAgo = diffDays;

                // ---------------------------------------------------------
                // 🔥 核心篩選邏輯：區分 User 與 開發者
                // ---------------------------------------------------------
                if (mode === 'NEW') {
                    if (diffDays > 3) return; 
                } else if (mode === 'HISTORY') {
                    if (diffDays > 15) return; // 🔒 User 鎖定 15 天限制
                } else if (mode === 'DEV_ALL') {
                    // 🚀 開發者模式：不設限，JSON 裡有多少（30天）就秀多少
                }
                
                filtered.push(s);
            });

            // 統一按報酬率由高到低排序
            filtered.sort((a, b) => b.roiNum - a.roiNum);

            let html = '';
            filtered.forEach(s => {
                const roi = s.roiNum.toFixed(1);
                const roiColor = roi == 0 ? "text-slate-500" : (s.roiNum > 0 ? "text-red-400" : "text-emerald-400");
                const isL1 = s.trend_status.includes('L1');
                const statusColor = isL1 ? 'bg-red-500/10 text-red-400 border-red-500/20' : 'bg-amber-500/10 text-amber-400 border-amber-500/20';

                html += `
                <div class="card bg-slate-900/40 rounded-2xl p-6 flex flex-col h-full border border-slate-800/50">
                    <div class="flex justify-between items-start mb-5">
                        <div>
                            <h2 class="text-2xl font-bold text-slate-100">${s.name}</h2>
                            <p class="text-slate-600 font-mono text-sm tracking-widest">${s.code}</p>
                        </div>
                        <div class="text-right">
                            <span class="text-[10px] text-slate-600 block uppercase font-black">Latest</span>
                            <span class="text-2xl font-black text-slate-200">$${s.price}</span>
                        </div>
                    </div>

                    <div class="flex items-center gap-2 mb-6">
                        <span class="px-2 py-0.5 rounded text-[11px] font-black bg-indigo-500/10 text-indigo-400 border border-indigo-500/20">${s.score} PTS</span>
                        <span class="px-2 py-0.5 rounded text-[11px] font-black border ${statusColor}">${isL1 ? 'L1 起漲' : 'L0 築底'}</span>
                    </div>

                    <div class="bg-slate-950/60 rounded-xl p-4 border border-slate-800/50 mb-6">
                        <div class="flex justify-between items-center mb-3 text-[10px] text-slate-500 font-bold uppercase">
                            <span>Entry: ${s.first_entry_date}</span>
                            <span class="bg-slate-800 text-slate-400 px-2 rounded-full">${s.daysAgo}D AGO</span>
                        </div>
                        <div class="flex justify-between items-end">
                            <div>
                                <span class="text-[10px] text-slate-600 block">初始進場價</span>
                                <span class="text-slate-400 font-bold">$${s.first_entry_price}</span>
                            </div>
                            <div class="text-right">
                                <span class="text-[10px] text-slate-600 block">累積報酬</span>
                                <span class="text-2xl font-black ${roiColor}">${s.roiNum > 0 ? '+' : ''}${roi}%</span>
                            </div>
                        </div>
                    </div>

                    <div class="grid grid-cols-2 gap-3 mt-auto">
                        <div class="bg-slate-900/80 p-2 rounded-lg border border-slate-800/30 text-center">
                            <span class="text-[10px] text-slate-600 block mb-0.5">季乖離</span>
                            <span class="text-sm font-black ${parseFloat(s.bias60) < -10 ? 'text-emerald-500' : 'text-slate-400'}">${s.bias60}</span>
                        </div>
                        <div class="bg-slate-900/80 p-2 rounded-lg border border-slate-800/30 text-center">
                            <span class="text-[10px] text-slate-600 block mb-0.5">量縮率</span>
                            <span class="text-sm font-black text-blue-500">${s.vol_ratio}</span>
                        </div>
                    </div>
                </div>`;
            });

            document.getElementById('stock-grid').innerHTML = filtered.length > 0 ? html : `<div class="col-span-full py-20 text-slate-700 italic border-2 border-dashed border-slate-800 rounded-3xl text-center font-bold">目前無符合天數之標的</div>`;
            document.getElementById('stats-banner').innerHTML = `顯示 <strong>${filtered.length}</strong> 檔績效標的 | 模式: ${mode === 'DEV_ALL' ? '開發者全局模式' : '15日追蹤模式'}`;
        }

        loadData();
    </script>
</body>
</html>
