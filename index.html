<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🛡️ 價值雷達戰情室</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #0f172a; color: #f8fafc; }
        .card { transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        .card:hover { transform: translateY(-4px); box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3); border-color: #3b82f6; }
    </style>
</head>
<body class="p-4 md:p-10 max-w-7xl mx-auto min-h-screen">

    <header class="mb-10 text-center md:text-left border-b border-slate-800 pb-6">
        <div class="flex flex-col md:flex-row md:items-end justify-between gap-4">
            <div>
                <h1 class="text-4xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-emerald-400 mb-2">🛡️ 價值雷達戰情室</h1>
                <p class="text-slate-400 font-medium">台股左側潛伏標的 · 籌碼與技術面量化監控</p>
            </div>
            <div id="updateTime" class="text-slate-500 text-sm font-mono bg-slate-900 px-4 py-2 rounded-full border border-slate-800">載入中...</div>
        </div>
    </header>

    <div class="flex flex-col md:flex-row gap-6 mb-10 items-center justify-between">
        <div class="flex bg-slate-900 p-1.5 rounded-xl border border-slate-800 w-full md:w-auto" id="filter-buttons">
            <button onclick="renderData('NEW')" id="btn-NEW" class="flex-1 md:flex-none px-6 py-2.5 rounded-lg font-bold transition-all">🆕 今日最新</button>
            <button onclick="renderData('HISTORY')" id="btn-HISTORY" class="flex-1 md:flex-none px-6 py-2.5 rounded-lg font-bold transition-all">📊 歷史追蹤</button>
        </div>
        <div id="stats-banner" class="text-slate-400 text-sm italic"></div>
    </div>

    <div id="stock-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
        <div class="text-center col-span-full py-20 text-slate-500 text-lg animate-pulse tracking-widest">正在讀取最新市場數據...</div>
    </div>

    <script>
        let globalData = [];
        let baseDate = new Date();

        async function loadData() {
            try {
                // 強制抓取最新 JSON 避免快取
                const response = await fetch('left_side_value.json?t=' + Date.now());
                globalData = await response.json();
                
                if (globalData.length > 0) {
                    // 以資料庫最新一筆日期為準，計算更精準
                    baseDate = new Date(globalData[0].date);
                    document.getElementById('updateTime').innerText = `📡 最後掃描: ${globalData[0].date}`;
                }
                renderData('NEW');
            } catch (e) {
                document.getElementById('stock-grid').innerHTML = `<div class="col-span-full text-center text-red-400 p-10 bg-red-900/10 rounded-2xl border border-red-900/20">無法讀取資料檔案 (left_side_value.json)</div>`;
            }
        }

        function renderData(mode) {
            // 切換按鈕樣式
            const isNew = mode === 'NEW';
            document.getElementById('btn-NEW').className = isNew ? "flex-1 md:flex-none px-6 py-2.5 rounded-lg font-bold bg-blue-600 text-white shadow-lg" : "flex-1 md:flex-none px-6 py-2.5 rounded-lg font-bold text-slate-400 hover:text-slate-200";
            document.getElementById('btn-HISTORY').className = !isNew ? "flex-1 md:flex-none px-6 py-2.5 rounded-lg font-bold bg-blue-600 text-white shadow-lg" : "flex-1 md:flex-none px-6 py-2.5 rounded-lg font-bold text-slate-400 hover:text-slate-200";

            let html = '';
            let showCount = 0;
            let totalHidden = 0;

            globalData.forEach(s => {
                const entryDate = new Date(s.first_entry_date);
                const diffDays = Math.ceil(Math.abs(baseDate - entryDate) / (1000 * 60 * 60 * 24));

                // 核心規則：超過 15 天不顯示
                if (diffDays > 15) {
                    totalHidden++;
                    return;
                }

                // 分流規則：NEW (0-3天), HISTORY (4-15天)
                if (mode === 'NEW' && diffDays > 3) return;
                if (mode === 'HISTORY' && diffDays <= 3) return;

                showCount++;
                
                // 計算 ROI
                const roi = ((parseFloat(s.price) - parseFloat(s.first_entry_price)) / parseFloat(s.first_entry_price) * 100).toFixed(1);
                const isProfit = roi > 0;
                const roiColor = roi == 0 ? "text-slate-400" : (isProfit ? "text-red-400" : "text-emerald-400");

                const isL1 = s.trend_status.includes('L1');
                const statusBadge = isL1 ? 'bg-red-500/10 text-red-400 border-red-500/20' : 'bg-amber-500/10 text-amber-400 border-amber-500/20';

                html += `
                <div class="card bg-slate-900/50 rounded-2xl p-6 border border-slate-800 flex flex-col h-full">
                    <div class="flex justify-between items-start mb-4">
                        <div>
                            <h2 class="text-2xl font-bold text-slate-100">${s.name}</h2>
                            <p class="text-slate-500 font-mono text-sm">${s.code}</p>
                        </div>
                        <div class="text-right">
                            <span class="text-sm text-slate-500 block mb-1">現價</span>
                            <span class="text-2xl font-black text-slate-100">$${s.price}</span>
                        </div>
                    </div>

                    <div class="flex items-center gap-2 mb-6">
                        <span class="px-2.5 py-1 rounded-md text-xs font-black bg-indigo-500/10 text-indigo-400 border border-indigo-500/20">${s.score} 分</span>
                        <span class="px-2.5 py-1 rounded-md text-xs font-bold border ${statusBadge}">${isL1 ? '🔥 起漲' : '⏳ 築底'}</span>
                    </div>

                    <div class="bg-slate-950/50 rounded-xl p-4 border border-slate-800/50 mb-6">
                        <div class="flex justify-between items-center mb-3">
                            <span class="text-xs text-slate-500">入榜日期: ${s.first_entry_date}</span>
                            <span class="text-[10px] bg-slate-800 text-slate-400 px-2 py-0.5 rounded-full">${diffDays} 天前</span>
                        </div>
                        <div class="flex justify-between items-end">
                            <div>
                                <span class="text-[10px] text-slate-600 block uppercase">初始價格</span>
                                <span class="text-slate-300 font-medium">$${s.first_entry_price}</span>
                            </div>
                            <div class="text-right">
                                <span class="text-[10px] text-slate-600 block uppercase">累積報酬</span>
                                <span class="text-2xl font-black ${roiColor}">${roi > 0 ? '+' : ''}${roi}%</span>
                            </div>
                        </div>
                    </div>

                    <div class="grid grid-cols-2 gap-4 mt-auto">
                        <div class="bg-slate-900/80 p-2 rounded-lg border border-slate-800/30 text-center">
                            <span class="text-[10px] text-slate-500 block mb-1">季乖離</span>
                            <span class="text-sm font-bold ${parseFloat(s.bias60) < -10 ? 'text-emerald-400' : 'text-slate-300'}">${s.bias60}</span>
                        </div>
                        <div class="bg-slate-900/80 p-2 rounded-lg border border-slate-800/30 text-center">
                            <span class="text-[10px] text-slate-500 block mb-1">量縮率</span>
                            <span class="text-sm font-bold text-blue-400">${s.vol_ratio}</span>
                        </div>
                    </div>
                </div>`;
            });

            const grid = document.getElementById('stock-grid');
            const banner = document.getElementById('stats-banner');
            
            grid.innerHTML = showCount > 0 ? html : `<div class="col-span-full text-center py-20 text-slate-600 border-2 border-dashed border-slate-800 rounded-3xl">此分類目前無追蹤標的</div>`;
            banner.innerHTML = `當前分類顯示 <strong>${showCount}</strong> 檔標的 (已自動隱藏 ${totalHidden} 檔逾期標的)`;
        }

        loadData();
    </script>
</body>
</html>
