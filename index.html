<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🛡️ 價值雷達戰情室 V2.5</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #0b0f1a; color: #f8fafc; }
        .card { transition: all 0.3s ease; border: 1px solid #1e293b; background: linear-gradient(145deg, #111827, #1f2937); }
        .card:hover { transform: translateY(-5px); box-shadow: 0 15px 30px -5px rgba(59, 130, 246, 0.3); border-color: #3b82f6; }
        .badge-power { background: linear-gradient(90deg, #f59e0b, #ef4444); color: white; animation: pulse 2s infinite; }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.7; } 100% { opacity: 1; } }
        .ver-tag { position: fixed; bottom: 10px; right: 10px; font-size: 10px; color: #475569; pointer-events: none; }
    </style>
</head>
<body class="p-4 md:p-10 max-w-7xl mx-auto min-h-screen">

    <div class="ver-tag">Ver 2.5 (Smart Tagging System)</div>

    <header class="mb-10 text-center md:text-left border-b border-slate-800 pb-6">
        <div class="flex flex-col md:flex-row md:items-end justify-between gap-4">
            <div>
                <h1 class="text-4xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-emerald-400 mb-2">價值雷達戰情室</h1>
                <p class="text-slate-400 font-medium italic">自動化標籤系統 · 數據深度解碼</p>
            </div>
            <div id="updateTime" class="text-slate-500 text-sm font-mono bg-slate-900 px-4 py-2 rounded-full border border-slate-800">數據解密中...</div>
        </div>
    </header>

    <div class="flex flex-col md:flex-row gap-6 mb-10 items-center justify-between">
        <div class="flex bg-slate-900 p-1.5 rounded-xl border border-slate-800 w-full md:w-auto overflow-x-auto">
            <button onclick="renderData('HISTORY')" id="btn-HISTORY" class="whitespace-nowrap px-6 py-2.5 rounded-lg font-bold transition-all">📊 歷史追蹤 (15日)</button>
            <button onclick="renderData('NEW')" id="btn-NEW" class="whitespace-nowrap px-6 py-2.5 rounded-lg font-bold transition-all">🆕 今日最新 (3日)</button>
            <button onclick="renderData('DEV_ALL')" id="btn-DEV_ALL" class="whitespace-nowrap px-6 py-2.5 rounded-lg font-bold transition-all border border-dashed border-slate-700">🚀 戰情全記錄</button>
        </div>
        <div id="stats-banner" class="text-slate-500 text-sm font-medium"></div>
    </div>

    <div id="stock-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
        <div class="col-span-full text-center py-20 text-slate-500 font-bold text-xl">雷達掃描中...</div>
    </div>

    <script>
        let globalData = [];
        let baseDate = new Date();

        async function loadData() {
            try {
                const response = await fetch('left_side_value.json?t=' + Date.now());
                globalData = await response.json();
                if (globalData.length > 0) {
                    baseDate = new Date(globalData[0].date);
                    document.getElementById('updateTime').innerText = `📡 最後同步: ${globalData[0].date}`;
                }
                renderData('HISTORY'); 
            } catch (e) {
                document.getElementById('stock-grid').innerHTML = `<div class="col-span-full text-center text-red-400 p-10 bg-red-900/10 rounded-2xl border border-red-900/20">JSON LINK ERROR</div>`;
            }
        }

        function renderData(mode) {
            const buttons = ['NEW', 'HISTORY', 'DEV_ALL'];
            buttons.forEach(b => {
                document.getElementById(`btn-${b}`).className = (b === mode) ? 
                    "whitespace-nowrap px-6 py-2.5 rounded-lg font-bold bg-blue-600 text-white shadow-lg" : 
                    "whitespace-nowrap px-6 py-2.5 rounded-lg font-bold text-slate-500 hover:text-slate-300";
            });

            let filtered = [];
            globalData.forEach(s => {
                const entryDate = new Date(s.first_entry_date);
                const diffDays = Math.ceil(Math.abs(baseDate - entryDate) / (1000 * 60 * 60 * 24));
                s.roiNum = ((parseFloat(s.price) - parseFloat(s.first_entry_price)) / parseFloat(s.first_entry_price) * 100);
                s.daysAgo = diffDays;

                if (mode === 'NEW' && diffDays > 3) return; 
                if (mode === 'HISTORY' && diffDays > 15) return;
                filtered.push(s);
            });

            filtered.sort((a, b) => b.roiNum - a.roiNum);

            let html = '';
            filtered.forEach(s => {
                const roi = s.roiNum.toFixed(1);
                const roiColor = roi == 0 ? "text-slate-500" : (s.roiNum > 0 ? "text-red-400" : "text-emerald-400");
                const volValue = parseFloat(s.vol_ratio);
                const buyDays = parseInt(s.buy_days);

                // 🔥 核心：智慧標籤邏輯
                let smartTags = '';
                if (buyDays >= 4 && volValue < 70) {
                    smartTags += `<span class="badge-power px-2 py-0.5 rounded text-[10px] font-black uppercase tracking-wider shadow-sm">💎 飆股基因</span>`;
                }
                if (buyDays === 5) {
                    smartTags += `<span class="bg-orange-500/20 text-orange-400 border border-orange-500/30 px-2 py-0.5 rounded text-[10px] font-bold">🎯 籌碼鎖定</span>`;
                }
                if (volValue < 50) {
                    smartTags += `<span class="bg-blue-500/20 text-blue-400 border border-blue-500/30 px-2 py-0.5 rounded text-[10px] font-bold">🌊 窒息量</span>`;
                }

                html += `
                <div class="card rounded-2xl p-6 flex flex-col h-full">
                    <div class="flex justify-between items-start mb-2">
                        <div>
                            <h2 class="text-2xl font-bold text-white">${s.name}</h2>
                            <p class="text-slate-600 font-mono text-sm tracking-widest">${s.code}</p>
                        </div>
                        <div class="text-right">
                            <span class="text-2xl font-black text-slate-100">$${s.price}</span>
                        </div>
                    </div>

                    <div class="flex flex-wrap gap-1.5 mb-4 min-h-[24px]">
                        ${smartTags}
                    </div>

                    <div class="flex items-center gap-2 mb-6">
                        <span class="px-2 py-0.5 rounded text-[10px] font-black bg-indigo-500/10 text-indigo-400 border border-indigo-500/20">${s.score} PTS</span>
                        <span class="px-2 py-0.5 rounded text-[10px] font-black border ${s.trend_status.includes('L1') ? 'bg-red-500/10 text-red-400 border-red-500/20' : 'bg-amber-500/10 text-amber-400 border-amber-500/20'}">${s.trend_status.includes('L1') ? 'L1 起漲' : 'L0 築底'}</span>
                    </div>

                    <div class="bg-slate-950/60 rounded-xl p-4 border border-slate-800/50 mb-6">
                        <div class="flex justify-between items-center mb-3 text-[10px] text-slate-500 font-bold">
                            <span>Entry: ${s.first_entry_date}</span>
                            <span class="bg-slate-800 text-slate-400 px-2 rounded-full">${s.daysAgo}D AGO</span>
                        </div>
                        <div class="flex justify-between items-end">
                            <div>
                                <span class="text-[10px] text-slate-600 block">初始價</span>
                                <span class="text-slate-400 font-bold">$${s.first_entry_price}</span>
                            </div>
                            <div class="text-right">
                                <span class="text-[10px] text-slate-600 block font-bold">累積績效</span>
                                <span class="text-2xl font-black ${roiColor}">${s.roiNum > 0 ? '+' : ''}${roi}%</span>
                            </div>
                        </div>
                    </div>

                    <div class="grid grid-cols-2 gap-3 mt-auto">
                        <div class="bg-slate-900/80 p-2 rounded-lg border border-slate-800/30 text-center">
                            <span class="text-[10px] text-slate-600 block mb-0.5">法人連買</span>
                            <span class="text-sm font-black text-orange-400">${s.buy_days} 天</span>
                        </div>
                        <div class="bg-slate-900/80 p-2 rounded-lg border border-slate-800/30 text-center">
                            <span class="text-[10px] text-slate-600 block mb-0.5">量縮率</span>
                            <span class="text-sm font-black text-blue-500">${s.vol_ratio}</span>
                        </div>
                    </div>
                </div>`;
            });

            document.getElementById('stock-grid').innerHTML = filtered.length > 0 ? html : `<div class="col-span-full py-20 text-slate-700 italic border-2 border-dashed border-slate-800 rounded-3xl text-center font-bold">無符合數據</div>`;
            document.getElementById('stats-banner').innerHTML = `顯示 <strong>${filtered.length}</strong> 檔標的 | 智慧診斷已啟動`;
        }

        loadData();
    </script>
</body>
</html>
