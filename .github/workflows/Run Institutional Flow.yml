name: Run Institutional Flow

on:
  schedule:
    # 台灣時間 18:30 與 22:30 各抓一次（週一至週五）。
    # 原因：當天的法人數字在收盤後數小時內可能被資料來源修正，晚間再抓一次可取得較定稿的數字。
    # GitHub 排程常會延遲，屬正常；資料沒變時不會產生新的 commit。
    - cron: '30 10 * * 1-5'
    - cron: '30 14 * * 1-5'
  workflow_dispatch: # 保留手動點擊觸發按鈕

jobs:
  run-flow:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Run institutional_flow
        env:
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
        run: python institutional_flow.py

      - name: Commit and Push if institutional_flow.json changed
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add institutional_flow.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "auto: update institutional_flow.json" && git pull --rebase && git push)
