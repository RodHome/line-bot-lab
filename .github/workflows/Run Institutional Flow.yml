name: Run Institutional Flow

on:
  schedule:
    # UTC 10:30 等於台灣時間 18:30（週一至週五執行；GitHub 排程常會延遲，屬正常）
    - cron: '30 10 * * 1-5'
  workflow_dispatch: # 保留手動點擊觸發按鈕

jobs:
  run-flow:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Run institutional_flow
        env:
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
        run: python institutional_flow.py

      - name: Commit and Push if institutional_flow.json changed
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add institutional_flow.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "auto: update institutional_flow.json" && git pull --rebase && git push)
