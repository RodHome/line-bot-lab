name: Run Market Risk Monitor

on:
  schedule:
    # UTC 時間 13:30 等於台灣時間 21:30（週一至週五執行）
    - cron: '30 13 * * 1-5'
  workflow_dispatch: # 保留手動點擊觸發按鈕

jobs:
  run-monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install yfinance pandas requests numpy

      - name: Run MarketRiskMonitor
        env:
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
        run: python MarketRiskMonitor.py

      - name: Commit and Push if market_risk.json changed
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add market_risk.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "auto: update market_risk.json" && git push)
