name: Daily Stock List Update

# 設定觸發條件：
# 1. schedule: 改為 07:00 UTC (等於台灣時間下午 15:00)
#    這樣可以直接抓到「當日」剛收盤的籌碼數據，不用等到隔天早上。
# 2. workflow_dispatch: 手動觸發按鈕
on:
  schedule:
    - cron: '0 7 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-stocks:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code (下載程式碼)
      uses: actions/checkout@v4

    - name: Set up Python (安裝 Python)
      uses: actions/setup-python@v5
      with:
        python-version: '3.9'

    - name: Install dependencies (安裝爬蟲套件)
      run: |
        pip install requests pandas lxml html5lib

    - name: Run generator (執行爬蟲)
      run: python generator.py

    - name: Commit and Push if changed (更新資料庫)
      run: |
        git config --global user.name 'GitHub Action Bot'
        git config --global user.email 'action@github.com'
        
        # 🔥 關鍵修改：同時加入兩個 JSON 檔案
        git add stock_list.json daily_recommendations.json
        
        # 檢查是否有變動，有才 commit，避免報錯
        git diff --quiet && git diff --staged --quiet || (git commit -m "🤖 Auto-update stock list & recommendations" && git push)
